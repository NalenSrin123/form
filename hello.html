<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form1.css">
</head>
<body>
    <div class="box">
        <form action="">
            <div class="form-group">
                <label for="name">គោត្តនាម</label>
                <input type="text" name="" id="name" placeholder="បញ្ចូលឈ្មោះ" >
            </div>
            <div class="form-group">
                <label for="phone">លេខទំនាក់ទំនង</label>
                <input type="text" name="" id="phone" placeholder="បញ្ចូលលេខទំនាក់ទំនង" >
            </div>
            <div class="form-group">
                <label for="country">ប្រទេស</label>
               <select name="" id="country">
                <option value="">កម្ពុជា</option>
                <option value="">ឡាវ</option>
                <option value="">ថៃ</option>
                <option value="">វៀតណាម</option>
                <option value="">មីយ៉ាន់ម៉ា</option>
                <option value="">ចិន</option>
                <option value="">កូរ៉េ</option>
                <option value="">ជប៉ុន</option>
                <option value="">អាមេរិក</option>
                <option value="">អង់គ្លេស</option>
                <option value="">អូស្រ្តាលី</option>
               </select>
            </div>
            <div class="button">
                <button type="submit">បញ្ជូន</button>
                <button type="reset">សំអាត</button>
            </div>
        </form>
    </div>
</body>
</html>
